---
apiVersion: apps/v1
kind: Deployment

metadata:
    name: web-v1

spec:
    strategy:
        rollingUpdate:
            maxSurge: 1
            maxUnavailable: 1
        type: RollingUpdate
    selector:
        matchLabels:
            app.kubernetes.io/name: auth-web
            app.kubernetes.io/version: v1
            app.kubernetes.io/component: web
    template:
        metadata:
            annotations:
                reloader.stakater.com/auto: "true"
        spec:
            serviceAccountName: web
            enableServiceLinks: false
            imagePullSecrets:
                - name: sweetrpg-registry
            containers:
                - name: app
                  image: auth-web
                  imagePullPolicy: Always
                  envFrom:
                      - configMapRef:
                            name: web-common
                      - configMapRef:
                            name: web-env
                      - secretRef:
                            name: web-auth0
                      - secretRef:
                            name: cache-auth
                  ports:
                      - containerPort: 8080
                        name: http
                  resources:
                      requests:
                          cpu: "20m"
                          memory: "55Mi"
                      limits:
                          cpu: "1"
                          memory: "512Mi"
                  livenessProbe:
                        httpGet:
                            path: /status/ping
                            port: http
                        initialDelaySeconds: 30
                        timeoutSeconds: 10
                        periodSeconds: 10
                  readinessProbe:
                        httpGet:
                            path: /status/ping
                            port: http
                        initialDelaySeconds: 10
                        timeoutSeconds: 10
                        periodSeconds: 10
            restartPolicy: Always
