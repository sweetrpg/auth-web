---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: auth-web-auth0

spec:
    refreshInterval: "1h"
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: web-auth0
        creationPolicy: Owner
    dataFrom:
        # Same Akeyless path as the dev overlay, i.e. the same Auth0 application/client id. That
        # application's Auth0 dashboard entry must additionally allow
        # https://sweetrpg.local/auth/callback in its Allowed Callback URLs list - Auth0 rejects
        # the redirect otherwise, TLS validity notwithstanding. Not something this YAML can
        # express; a human with Auth0 dashboard access has to add it.
        - extract:
              key: /sweetrpg/dev/auth/auth0
