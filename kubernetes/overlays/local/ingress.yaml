---
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: web-v1
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: sweetrpg-auth-errors-shared-web@kubernetescrd
    kubernetes.io/ingress.class: traefik

spec:
  ingressClassName: traefik
  rules:
    - host: sweetrpg.local
      http:
        paths:
          # No stripPrefix Middleware - see dev overlay's ingress.yaml comment.
          - pathType: Prefix
            path: /auth
            backend:
              service:
                name: web-v1
                port:
                  name: http
