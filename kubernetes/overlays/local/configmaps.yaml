---
apiVersion: v1
kind: ConfigMap

metadata:
  name: web-env

data:
  ENV: local
  PORT: "8080"
  # Shared "redis" instance in sweetrpg-support - see dev overlay's comment for the DB-index
  # registry pointer.
  REDIS_HOST: redis.sweetrpg-support.svc.cluster.local
  REDIS_PORT: "6379"
  REDIS_DB: "2"
  # Server-to-server backend URL, called directly Service-to-Service - no ingress in the path.
  USERS_API_URL: http://api-v1.sweetrpg-user.svc.cluster.local:8000
  # Shared host behind the single traefik-tailscale front door, same convention as the dev
  # overlay's dev.sweetrpg.com.
  AUTH0_CALLBACK_URL: https://sweetrpg.local/auth/callback
  LOG_LEVEL: info
