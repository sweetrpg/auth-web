---
apiVersion: v1
kind: ConfigMap

metadata:
  name: web-env

data:
  ENV: local
  PORT: "8080"
  # This app's own dedicated Redis instance - see that file's comment in the dev overlay.
  REDIS_HOST: cache.sweetrpg-auth.svc.cluster.local
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  # Session expiry policy in days - see the dev overlay's comment (values match driver defaults).
  SESSION_IDLE_TTL_DAYS: "30"
  SESSION_ABSOLUTE_TTL_DAYS: "90"
  # Server-to-server backend URL, called directly Service-to-Service - no ingress in the path.
  AUTH_API_URL: http://api-v1.sweetrpg-auth.svc.cluster.local:8000
  # Shared host behind the single traefik-tailscale front door (see
  # support/config/K8s/traefik/overlays/minikube), same convention as the dev overlay's
  # dev.sweetrpg.com.
  AUTH0_CALLBACK_URL: https://sweetrpg.local/auth/callback
  LOG_LEVEL: info
  ROOT_URL: https://sweetrpg.local/
  ASSETS_URL: https://sweetrpg.local/assets
  SHARED_URL: https://sweetrpg.local/shared
  # Tempo's distributor, same as dev overlay (observability stack is environment-independent).
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo-distributor.observability.svc.cluster.local:4317/
