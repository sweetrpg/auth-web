---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: auth-web-auth0

spec:
    refreshInterval: "1h"
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: web-auth0
        creationPolicy: Owner
    dataFrom:
        # The single, shared Auth0 application every frontend used to register separately -
        # see design.md's "One shared Auth0 application" decision in platform's
        # add-user-api-authn-authz change. AUTH0_DOMAIN/AUTH0_CLIENT_ID/AUTH0_CLIENT_SECRET/
        # AUTH0_AUDIENCE populated at this Akeyless path once that registration exists - not done
        # yet, same "human follow-up required" gap admin-web's README documents for its own
        # (now-retired) per-app registration.
        - extract:
              key: /sweetrpg/dev/auth/auth0
