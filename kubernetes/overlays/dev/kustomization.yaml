apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sweetrpg-auth

resources:
  - ../../base
  - configmaps.yaml
  - secrets.yaml
  - ingress.yaml
  - middlewares.yaml
  - pod-monitor.yaml

labels:
  - pairs:
      app: web
      version: v1
      platform: sweetrpg
      package: auth
      component: web

generatorOptions:
  disableNameSuffixHash: true

images:
  - name: auth-web
    newName: ghcr.io/sweetrpg/auth-web
    newTag: latest
